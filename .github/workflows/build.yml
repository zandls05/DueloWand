name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar
        run: mvn -B package

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: DueloWand
          path: target/DueloWand.jar
